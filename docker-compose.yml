# Cotta behind a Cloudflare Tunnel. Copy .env.example to .env and fill it in.
#
# The tunnel is optional (--profile tunnel). It reaches Cotta over the
# internal Docker network, and with COTTA_CF_* set, requests that did not
# pass Cloudflare Access are refused.
services:
  cotta:
    build: .
    container_name: Cotta
    restart: unless-stopped
    environment:
      COTTA_CF_TEAM_DOMAIN: ${COTTA_CF_TEAM_DOMAIN:-}
      COTTA_CF_AUD: ${COTTA_CF_AUD:-}
      COTTA_IDLE_LOCK: ${COTTA_IDLE_LOCK:-12h}
    # Data lives in the data folder next to this file. update.sh makes sure
    # the user below can write to it.
    user: "${COTTA_UID:-65532}:${COTTA_GID:-65532}"
    volumes:
      - ./data:/data
    # Reachable from your local network by default, at this machine's
    # address. Set COTTA_BIND=127.0.0.1 to answer on this machine only, and
    # do that on any machine that is exposed to the internet.
    ports:
      - "${COTTA_BIND:-0.0.0.0}:${COTTA_PORT:-8230}:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - cotta
    profiles: ["tunnel"]
