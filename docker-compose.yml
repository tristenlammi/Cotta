# Cotta behind a Cloudflare Tunnel. Copy .env.example to .env and fill it in.
#
# By default Cotta answers only on this machine (127.0.0.1). The tunnel
# reaches it over the internal Docker network, and with COTTA_CF_* set,
# requests that did not pass Cloudflare Access are refused.
services:
  cotta:
    build: .
    restart: unless-stopped
    environment:
      COTTA_CF_TEAM_DOMAIN: ${COTTA_CF_TEAM_DOMAIN:-}
      COTTA_CF_AUD: ${COTTA_CF_AUD:-}
      COTTA_IDLE_LOCK: ${COTTA_IDLE_LOCK:-12h}
    volumes:
      - cotta-data:/data
    # COTTA_BIND=0.0.0.0 opens it to your local network; only do that on a
    # network you trust, and never on a machine exposed to the internet.
    ports:
      - "${COTTA_BIND:-127.0.0.1}:${COTTA_PORT:-8080}:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - cotta
    profiles: ["tunnel"]

volumes:
  cotta-data:
